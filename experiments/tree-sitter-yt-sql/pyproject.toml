[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-yt-sql"
description = "Experimental yt-sql grammar for yt-media-tools"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "yt-sql"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Ryan" }]
requires-python = ">=3.10"
license.text = "LGPL-2.1-only"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/sciguyryan/yt-media-tools"

[project.optional-dependencies]
core = ["tree-sitter==0.26.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
