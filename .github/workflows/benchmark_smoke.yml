name: Benchmark smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-smoke:
    name: Run benchmark smoke suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pytest -r requirements-benchmark.txt

      - name: Run benchmark smoke checks
        run: python -m pytest benchmarks/test_query_pipeline_benchmarks.py --benchmark-only --benchmark-min-rounds=1 --benchmark-max-time=0.05
