name: SQLite SQL quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SQLFluff
        run: python -m pip install -r common/sqlite/requirements-lint.txt
      - name: Lint canonical SQLite statements
        run: sqlfluff lint --config .sqlfluff common/sqlite/statements
