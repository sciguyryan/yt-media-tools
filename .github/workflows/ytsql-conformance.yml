name: YT-SQL portable conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-conformance:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runtime Unicode data version
        run: python -c "import platform, sys, unicodedata; print(platform.platform(), sys.version, 'Unicode', unicodedata.unidata_version)"
      - name: Check approved portable conformance
        run: python yt-sql/run_conformance.py --implementation python --report-file conformance-python.json
      - name: Validate generated conformance report
        if: always()
        shell: bash
        run: |
          if [ -f conformance-python.json ]; then
            python yt-sql/validate_report.py conformance-python.json
          else
            echo "No conformance report was generated (execution or setup may have failed)."
          fi
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytsql-python-${{ matrix.os }}-${{ matrix.python-version }}
          path: conformance-python.json
          if-no-files-found: ignore
