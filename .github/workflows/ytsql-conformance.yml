name: YT-SQL portable conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check approved portable conformance
        run: python yt-sql/run_conformance.py --implementation python --report-file conformance-python.json
      - name: Validate generated conformance report
        if: always()
        run: |
          if [ -f conformance-python.json ]; then
            python yt-sql/validate_report.py conformance-python.json
          else
            echo "No conformance report was generated (execution or setup may have failed)."
          fi
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytsql-python-conformance
          path: conformance-python.json
          if-no-files-found: ignore
