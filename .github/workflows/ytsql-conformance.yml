name: YT-SQL portable conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-conformance:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runtime Unicode data version
        run: python -c "import platform, sys, unicodedata; print(platform.platform(), sys.version, 'Unicode', unicodedata.unidata_version)"
      - name: Check approved portable conformance
        run: python yt-sql/run_conformance.py --implementation python --report-file conformance-python.json
      - name: Validate generated conformance report
        if: always()
        shell: bash
        run: |
          if [ -f conformance-python.json ]; then
            python yt-sql/validate_report.py conformance-python.json
          else
            echo "No conformance report was generated (execution or setup may have failed)."
          fi
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytsql-python-${{ matrix.os }}-${{ matrix.python-version }}
          path: conformance-python.json
          if-no-files-found: ignore

  rust-conformance:
    name: Rust conformance on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the conformance binary
        run: cargo build --locked -p yt-sql
        working-directory: rust
      - name: Check Rust portable conformance
        run: python yt-sql/run_conformance.py --implementation rust --report-file conformance-rust.json
      - name: Validate generated conformance report
        if: always()
        shell: bash
        run: |
          if [ -f conformance-rust.json ]; then
            python yt-sql/validate_report.py conformance-rust.json
          else
            echo "No conformance report was generated (execution or setup may have failed)."
          fi
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytsql-rust-ubuntu-latest
          path: conformance-rust.json
          if-no-files-found: ignore

  platform-parity:
    name: Compare portable platform reports
    needs: python-conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all environment reports
        uses: actions/download-artifact@v4
        with:
          pattern: ytsql-python-*
          path: platform-reports
      - name: Certify complete nine-environment report set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path('platform-reports')
          expected = {f'ytsql-python-{os}-{version}' for os in ('ubuntu-latest', 'macos-latest', 'windows-latest') for version in ('3.12', '3.13', '3.14')}
          actual = {path.name for path in root.iterdir() if path.is_dir()} if root.exists() else set()
          if actual != expected:
              print(f'Missing: {sorted(expected - actual)}; unexpected: {sorted(actual - expected)}', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Compare approved outcomes across platforms
        shell: bash
        run: python yt-sql/compare_platform_reports.py platform-reports/*/conformance-python.json
