name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ruff lint checks
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.6"
          args: "check ."

      - name: Run Ruff format checks
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.6"
          args: "format --check --diff ."
