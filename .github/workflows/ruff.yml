name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.2"
          args: "check ."

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.2"
          args: "format --check ."
