name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.6"
          args: "--version"

      - name: Report Ruff environment
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo "Ruff version:"
          ruff --version

          echo "Working directory:"
          pwd

      - name: Run Ruff lint checks
        run: ruff check --no-cache --config ./ruff.toml .

      - name: Run Ruff format checks
        run: ruff format --no-cache --config ./ruff.toml --check --diff .


  pytest:
    name: Routine pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Run routine pytest suite
        run: python -m pytest


  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.23.2

      - name: Run Markdown lint checks
        run: markdownlint-cli2 "**/*.md"
