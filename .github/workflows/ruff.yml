name: Ruff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.6"
          args: "--version"

      - name: Report Ruff environment
        run: |
          git rev-parse HEAD
          ruff --version
          pwd

      - name: Run Ruff lint checks
        run: ruff check --config ./ruff.toml .

      - name: Run Ruff format checks
        run: ruff format --config ./ruff.toml --check --diff .
