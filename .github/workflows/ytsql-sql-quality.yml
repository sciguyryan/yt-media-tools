name: YT-SQL SQL quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlfluff-ytsql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SQLFluff
        run: python -m pip install -r common/sqlite/requirements-lint.txt
      - name: Audit YT-SQL grammar coverage
        run: python yt-sql/sqlfluff/audit_grammar.py
      - name: Check YT-SQL formatting without modifying files
        run: python scripts/ytsql_format.py check
      - name: Verify YT-SQL dialect and formatting safety
        run: python -m unittest discover -s yt-sql/sqlfluff -p 'test_*.py'
