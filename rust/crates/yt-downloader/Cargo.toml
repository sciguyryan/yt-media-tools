[package]
name = "yt-downloader"
version = "0.1.0"
edition = "2024"
description = "Native Rust implementation of the YT Media Tools downloader (in development)"
license-file = "../../../LICENSE"
publish = false

[[bin]]
name = "yt-download-rs"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std"] }
serde_json = "1.0"
home = "=0.5.11"
